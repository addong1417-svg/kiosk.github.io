<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달콤 키오스크</title>
<style>
:root{--ink:#382b25;--muted:#7d6a60;--cream:#fffaf3;--brown:#75452f;--peach:#f4d4bd;--line:#eadfd5;--green:#47785b;--red:#a34437}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:700;transition:.15s}button:hover{filter:brightness(.96);transform:translateY(-1px)}
header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px clamp(16px,4vw,44px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.logo{font-weight:900;font-size:21px;letter-spacing:-1px}.logo span{color:var(--brown)}
.nav{display:flex;gap:8px}.nav button{background:#f5eee7;color:var(--brown)}.nav button.active{background:var(--brown);color:white}
main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.hero{margin-bottom:24px}.eyebrow{color:var(--brown);font-size:12px;font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(27px,5vw,42px);margin:7px 0}.hero p{color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.product{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #57331a0a}
.product img{width:100%;height:190px;object-fit:contain;background:#fff}
.product-body{padding:14px}.product h3{margin:0 0 5px;font-size:18px}.product p{margin:0;color:var(--muted);font-size:13px}.product-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.price{font-size:17px;font-weight:900}.add{background:var(--brown);color:white;min-width:43px}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px #57331a0a}.panel h2{margin:0 0 15px;font-size:20px}.cart{position:sticky;top:90px}.empty{padding:20px 5px;color:var(--muted);text-align:center;font-size:14px}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-line small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 9px;background:#f4eee8}.total{display:flex;justify-content:space-between;font-weight:900;font-size:19px;padding:17px 0}.primary{background:var(--brown);color:white;width:100%;padding:14px}.subtle{background:#f4eee8;color:var(--brown)}.notice{margin-top:12px;font-size:13px;color:var(--green);min-height:18px}
.hidden{display:none!important}.admin-wrap{max-width:850px;margin:auto}.login{max-width:390px;margin:45px auto}.login p{color:var(--muted);font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:10px;outline-color:var(--brown)}.admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:125px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:23px}.order{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}.order-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.order-id{font-size:12px;color:var(--muted)}.order-items{margin:10px 0;line-height:1.7}.order-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.order-actions{display:flex;gap:7px;flex-wrap:wrap}.status{font-size:12px;font-weight:800;border-radius:999px;padding:5px 9px;background:#fff0d8;color:#8a5a1f}.status.완료{background:#e7f4e9;color:#326743}.status.취소{background:#fbe9e7;color:#9b3c33}.danger{background:#fbe9e7;color:var(--red)}.small{padding:8px 10px;font-size:13px}.footnote{font-size:12px;color:var(--muted);line-height:1.6;margin-top:20px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.cart{position:static;order:-1}.product img{height:155px}}
@media(max-width:420px){.menu-grid{grid-template-columns:1fr}.product img{height:200px}header{align-items:flex-start;gap:10px}.logo{font-size:18px}}
</style>
</head>
<body>
<header><div class="logo">달콤<span>키오스크</span></div><nav class="nav"><button id="navOrder" class="active" onclick="showPage('order')">주문하기</button><button id="navAdmin" onclick="showPage('admin')">관리자</button></nav></header>
<main>
<section id="orderPage">
 <div class="hero"><div class="eyebrow">SWEET MOMENTS</div><h1>오늘의 달콤함을 골라보세요.</h1><p>메뉴를 담고 주문하기를 눌러주세요.</p></div>
 <div class="layout"><div class="menu-grid" id="menuGrid"></div>
 <aside class="panel cart"><h2>내 주문 <span id="cartCount" style="color:#9b7863;font-size:14px"></span></h2><div id="cartItems" class="empty">메뉴를 담아주세요 🍞</div><div class="total"><span>합계</span><span id="cartTotal">0원</span></div><button class="primary" id="orderButton" onclick="submitOrder()">주문하기</button><div id="orderNotice" class="notice" role="status"></div></aside></div>
</section>
<section id="adminPage" class="hidden">
 <div class="hero"><div class="eyebrow">ORDER CONTROL</div><h1>주문 관리</h1><p>접수된 주문을 확인하고 처리 상태를 변경할 수 있어요.</p></div>
 <div id="loginPanel" class="panel login"><h2>관리자 로그인</h2><p>관리자 비밀번호를 입력하세요.</p><form onsubmit="loginAdmin(event)"><div class="field"><label for="adminPassword">비밀번호</label><input id="adminPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호 입력" required></div><button class="primary" type="submit">로그인</button><div id="loginError" class="notice" style="color:var(--red)"></div></form></div>
 <div id="adminDashboard" class="hidden admin-wrap"><div class="admin-toolbar"><h2 style="margin:0">주문 현황</h2><div><button class="subtle" onclick="loadDemoOrders()">샘플 주문 보기</button> <button class="danger" onclick="logoutAdmin()">로그아웃</button></div></div><div class="stats"><div class="stat"><small>전체 주문</small><strong id="statAll">0</strong></div><div class="stat"><small>접수 대기</small><strong id="statWait">0</strong></div><div class="stat"><small>처리 완료</small><strong id="statDone">0</strong></div></div><div id="ordersList"></div><p class="footnote">Firebase 설정을 입력하면 주문이 실시간으로 동기화됩니다. 샘플 주문은 현재 브라우저에서만 확인하는 예시이며 실제 주문 데이터가 아닙니다.</p></div>
</section>
</main>

let cart={}, db=null, unsubscribeOrders=null, isAdmin=false, demoMode=false, demoOrders=[];
const won=n=>n.toLocaleString("ko-KR")+"원";
function initFirebase(){
 try{
  if(firebaseConfig.apiKey!=="YOUR_API_KEY" && firebaseConfig.projectId!=="YOUR_PROJECT_ID" && window.firebase){
   if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
   db=firebase.firestore();
  }
 }catch(e){console.error("Firebase 초기화 실패:",e)}
}
function showPage(page){
 document.getElementById("orderPage").classList.toggle("hidden",page!=="order");
 document.getElementById("adminPage").classList.toggle("hidden",page!=="admin");
 document.getElementById("navOrder").classList.toggle("active",page==="order");
 document.getElementById("navAdmin").classList.toggle("active",page==="admin");
 if(page==="admin" && isAdmin) subscribeOrders();
}
function renderMenu(){
 document.getElementById("menuGrid").innerHTML=PRODUCTS.map(p=>`<article class="product"><img src="${p.image}" alt="${p.name}"><div class="product-body"><h3>${p.name}</h3><p>${p.desc}</p><div class="product-foot"><span class="price">${won(p.price)}</span><button class="add" aria-label="${p.name} 담기" onclick="addToCart('${p.id}')">+</button></div></div></article>`).join("");
}
function addToCart(id){cart[id]=(cart[id]||0)+1;renderCart();document.getElementById("orderNotice").textContent=""}
function changeQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){
 const items=PRODUCTS.filter(p=>cart[p.id]);const count=items.reduce((s,p)=>s+cart[p.id],0);const total=items.reduce((s,p)=>s+p.price*cart[p.id],0);
 document.getElementById("cartCount").textContent=count?`(${count}개)`:"";
 document.getElementById("cartTotal").textContent=won(total);
 document.getElementById("cartItems").className=items.length?"":"empty";
 document.getElementById("cartItems").innerHTML=items.length?items.map(p=>`<div class="cart-line"><div><strong>${p.name}</strong><small>${won(p.price)} × ${cart[p.id]}</small></div><div class="qty"><button onclick="changeQty('${p.id}',-1)" aria-label="수량 줄이기">−</button><b>${cart[p.id]}</b><button onclick="changeQty('${p.id}',1)" aria-label="수량 늘리기">+</button></div></div>`).join(""):"메뉴를 담아주세요 🍞";
 document.getElementById("orderButton").disabled=!count;document.getElementById("orderButton").style.opacity=count?"1":".55";
}
async function submitOrder(){
 const items=PRODUCTS.filter(p=>cart[p.id]).map(p=>({id:p.id,name:p.name,price:p.price,quantity:cart[p.id]}));
 if(!items.length)return;
 const order={items,total:items.reduce((s,i)=>s+i.price*i.quantity,0),status:"접수",createdAt:Date.now()};
 const notice=document.getElementById("orderNotice");
 try{
  if(db){await db.collection("orders").add({...order,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdAtMs:Date.now()});}
  else {notice.textContent="Firebase 미연결 상태라 실제 주문은 저장되지 않았어요. 설정 후 다시 주문해주세요.";notice.style.color="var(--red)";return;}
  cart={};renderCart();notice.style.color="var(--green)";notice.textContent="주문이 접수되었습니다. 감사합니다!";
 }catch(e){console.error(e);notice.style.color="var(--red)";notice.textContent="주문 저장에 실패했어요. Firebase 설정과 보안 규칙을 확인해주세요."}
}
function loginAdmin(e){e.preventDefault();if(document.getElementById("adminPassword").value===ADMIN_PASSWORD){isAdmin=true;document.getElementById("loginPanel").classList.add("hidden");document.getElementById("adminDashboard").classList.remove("hidden");document.getElementById("loginError").textContent="";subscribeOrders()}else{document.getElementById("loginError").textContent="비밀번호가 올바르지 않습니다."}}
function logoutAdmin(){isAdmin=false;if(unsubscribeOrders){unsubscribeOrders();unsubscribeOrders=null}document.getElementById("loginPanel").classList.remove("hidden");document.getElementById("adminDashboard").classList.add("hidden");document.getElementById("adminPassword").value=""}
function subscribeOrders(){
 if(db){demoMode=false;if(unsubscribeOrders)unsubscribeOrders();unsubscribeOrders=db.collection("orders").orderBy("createdAtMs","desc").onSnapshot(s=>{renderOrders(s.docs.map(d=>({id:d.id,...d.data()})))},e=>{console.error(e);document.getElementById("ordersList").innerHTML='<div class="panel">주문을 불러오지 못했습니다. Firestore 규칙과 인덱스 설정을 확인해주세요.</div>'})}
 else renderOrders(demoOrders);
}
function loadDemoOrders(){demoMode=true;if(unsubscribeOrders){unsubscribeOrders();unsubscribeOrders=null}if(!demoOrders.length)demoOrders=[{id:"sample-001",items:[{name:"미니붕어빵",price:3000,quantity:2},{name:"흑당버블티",price:4500,quantity:1}],total:10500,status:"접수",createdAtMs:Date.now()},{id:"sample-002",items:[{name:"허니브레드",price:5500,quantity:1}],total:5500,status:"완료",createdAtMs:Date.now()-60000}];renderOrders(demoOrders)}
function renderOrders(orders){
 document.getElementById("statAll").textContent=orders.length;document.getElementById("statWait").textContent=orders.filter(o=>o.status==="접수"||o.status==="준비중").length;document.getElementById("statDone").textContent=orders.filter(o=>o.status==="완료").length;
 const list=document.getElementById("ordersList");
 if(!orders.length){list.innerHTML='<div class="panel empty">아직 접수된 주문이 없습니다.</div>';return}
 list.innerHTML=orders.map(o=>`<article class="order"><div class="order-top"><div><strong>주문 #${escapeHtml(o.id.slice(-8))}</strong><div class="order-id">${formatTime(o.createdAtMs||Date.now())}</div></div><span class="status ${o.status==="완료"?"완료":o.status==="취소"?"취소":""}">${escapeHtml(o.status||"접수")}</span></div><div class="order-items">${(o.items||[]).map(i=>`${escapeHtml(i.name)} × ${i.quantity} <span style="color:var(--muted)">(${won(i.price*i.quantity)})</span>`).join("<br>")}</div><div class="order-bottom"><strong>${won(o.total||0)}</strong><div class="order-actions"><button class="subtle small" onclick="setStatus('${escapeAttr(o.id)}','준비중')">준비중</button><button class="subtle small" onclick="setStatus('${escapeAttr(o.id)}','완료')">완료 처리</button><button class="danger small" onclick="setStatus('${escapeAttr(o.id)}','취소')">취소</button><button class="danger small" onclick="deleteOrder('${escapeAttr(o.id)}')">삭제</button></div></div></article>`).join("");
}
async function setStatus(id,status){
 if(demoMode){demoOrders=demoOrders.map(o=>o.id===id?{...o,status}:o);renderOrders(demoOrders);return}
 if(!db)return;try{await db.collection("orders").doc(id).update({status})}catch(e){alert("상태 변경 실패: Firebase 보안 규칙을 확인해주세요.");console.error(e)}
}
async function deleteOrder(id){
 if(!confirm("이 주문을 삭제할까요?"))return;
 if(demoMode){demoOrders=demoOrders.filter(o=>o.id!==id);renderOrders(demoOrders);return}
 if(!db)return;try{await db.collection("orders").doc(id).delete()}catch(e){alert("삭제 실패: Firebase 보안 규칙을 확인해주세요.");console.error(e)}
}
function formatTime(ms){return new Date(ms).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,"")}
initFirebase();renderMenu();renderCart();
</script>
</body>
</html>
